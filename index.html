<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4fbfd">
<meta name="description" content="1日のたんぱく質量を記録するツール。必要量は日本人の食事摂取基準（2025年版）、食品の値は日本食品標準成分表（八訂）増補2023年に基づきます。">
<title>たんぱく質ノート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="たんぱく質ノート">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar">
  <h1>たんぱく質ノート</h1>
  <div class="datenav" id="datenav">
    <button class="icon-btn" id="prevDay" aria-label="前の日">‹</button>
    <button class="date-label" id="dateLabel"></button>
    <button class="icon-btn" id="nextDay" aria-label="次の日">›</button>
    <button class="today-btn" id="todayBtn" hidden>今日へ</button>
  </div>
</header>

<main>
  <section id="tab-today" class="tab"></section>
  <section id="tab-history" class="tab" hidden></section>
  <section id="tab-settings" class="tab" hidden></section>
</main>

<nav class="tabbar">
  <button data-tab="today" class="active"><span class="tb-ico">●</span>きょう</button>
  <button data-tab="history"><span class="tb-ico">▮</span>履歴</button>
  <button data-tab="settings"><span class="tb-ico">⚙</span>設定・出典</button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>
<div class="photo-viewer" id="photoViewer" hidden></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>

<script src="photos.js"></script>
<script src="app.js"></script>
</body>
</html>
